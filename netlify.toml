# Netlify builds and deploys automatically from the linked GitHub repo:
# every push/merge to main goes to production, pull requests get deploy previews.

[build]
  command = "yarn generate"
  # On Netlify (NETLIFY=true) Nuxt uses the netlify-static preset, which outputs to dist/
  # rather than .output/public/ like a local `yarn generate` does
  publish = "dist"

[build.environment]
  # Node version also comes from .nvmrc; set here so it's explicit
  NODE_VERSION = "24.22.0"
  # Skip the husky git hooks install on the build machine
  HUSKY = "0"
